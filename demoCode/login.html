<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center; 
      align-items: center;   
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 320px;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 0.8rem;
    }
    label {
      display: block;
      margin-bottom: 0.1rem;
      font-weight: bold;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background-color: #2738f2;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #737cdd;
    }

    .modal {
  display: none; 
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%; 
  height: 100%; 
  overflow: auto; 
  background-color: rgb(0,0,0); 
  background-color: rgba(0,0,0,0.4); 
}

.modal-content {
  background-color: #fefefe;
  margin: 14% auto; 
  padding: 20px;
  border: 1px solid #888;
  width: 30%; 
}
.close {
  color: #aaa;
  float: right;
  font-size: 28px;
  font-weight: bold;
}
.close {
  color: #aaa;
  float: right;
  font-size: 28px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
}

</style>
</head>
<body>
  <form id="AuthenticateUser">
    <h1> Login with email</h1>

    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="jane.smith@example.com"
        required
      >
    </div>

   <button type="submit" >Send Code</button>
  </form>

<div id="otpSection" class="modal">
  <div class="modal-content">
     <span id ='span' class="close">&times;</span>
   <h3>Enter the security code sent to your email address:</h3>
  <form id="otpForm">
    <input type="text" id="otp" placeholder="000000" required />
    <button type="submit">Verify Code</button>
  </form>
  </div>
</div>  

<script src="login.js" defer></script>
  
</body>
</html>
